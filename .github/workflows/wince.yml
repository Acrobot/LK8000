name: WinCE

on:
  push:
    branches: [wince]
  pull_request:
  workflow_dispatch:

jobs:
  wince-cxx20-smoke:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/salman-javed-nz/docker-cegcc-arm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          arm-mingw32ce-g++ --version
          arm-mingw32ce-ld --version

      - name: Build C++20 WinCE executables
        run: |
          mkdir -p out/wince
          COMMON_FLAGS="-std=gnu++20 -O2 -Wall -Wextra -D_WIN32_WCE=0x0420 -DWIN32_PLATFORM_PSPC=400 -DUNICODE -D_UNICODE -mcpu=xscale"
          arm-mingw32ce-g++ $COMMON_FLAGS \
            wince/smoke/hello.cpp \
            -o out/wince/hello-wince.exe
          arm-mingw32ce-g++ $COMMON_FLAGS \
            wince/smoke/runtime.cpp \
            -o out/wince/runtime-wince.exe

      - name: Inspect PE images
        shell: bash
        run: |
          arm-mingw32ce-objdump -f out/wince/hello-wince.exe
          arm-mingw32ce-objdump -p out/wince/hello-wince.exe > out/wince/hello-pe.txt
          arm-mingw32ce-objdump -f out/wince/runtime-wince.exe
          arm-mingw32ce-objdump -p out/wince/runtime-wince.exe > out/wince/runtime-pe.txt
          grep -q "pei-arm-wince-little" <(arm-mingw32ce-objdump -f out/wince/runtime-wince.exe)
          grep -q "COREDLL.dll" out/wince/runtime-pe.txt

      - name: Upload smoke executables
        uses: actions/upload-artifact@v4
        with:
          name: wince-smoke
          path: out/wince/

  current-master-object-probe:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/salman-javed-nz/docker-cegcc-arm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare WinCE dependency headers
        run: sh wince/prepare-deps.sh

      - name: Compile representative current-master objects
        shell: bash
        run: |
          mkdir -p out/wince
          set -o pipefail
          for target in \
            Bin/WINCE/xcs/Screen/GDI/Init.o \
            Bin/WINCE/xcs/Event/GDI/Loop.o \
            Bin/WINCE/OS/Win/Memory.o \
            Bin/WINCE/Library/poco/Mutex.o \
            Bin/WINCE/Comm/SerialPort.o
          do
            echo "===== $target =====" | tee -a out/wince/current-master-probe.log
            sh wince/build-current.sh "$target" V=2 2>&1 | tee -a out/wince/current-master-probe.log
          done

      - name: Upload current-master probe log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-master-probe
          path: out/wince/current-master-probe.log

  current-master-full-probe:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/salman-javed-nz/docker-cegcc-arm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare WinCE dependency headers
        run: sh wince/prepare-deps.sh

      - name: Probe complete current-master build
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p out/wince
          set -o pipefail
          sh wince/build-current.sh -k -j2 LK8000-WINCE.exe V=1 \
            2>&1 | tee out/wince/full-master-probe.log

      - name: Upload full-build probe log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-master-probe
          path: out/wince/full-master-probe.log

  pockethle-runtime-smoke:
    runs-on: ubuntu-24.04
    needs: wince-cxx20-smoke

    steps:
      - name: Checkout LK8000 WinCE overlay
        uses: actions/checkout@v4

      - name: Download WinCE smoke executable
        uses: actions/download-artifact@v4
        with:
          name: wince-smoke
          path: out/wince

      - name: Install PocketHLE native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libclang-dev libasound2-dev

      - name: Build PocketHLE CLI with Unicorn
        run: |
          git clone --depth 1 https://github.com/j92580498-max/PocketHLE.git /tmp/PocketHLE
          cd /tmp/PocketHLE
          cargo build --release -p pocket-cli --features unicorn

      - name: Inspect and execute WinCE ARM binary
        run: |
          /tmp/PocketHLE/target/release/pockethle pe-info "$GITHUB_WORKSPACE/out/wince/runtime-wince.exe"
          timeout 30s /tmp/PocketHLE/target/release/pockethle run \
            "$GITHUB_WORKSPACE/out/wince/runtime-wince.exe" \
            --cpu unicorn

  clang-xscale-frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Verify modern C++20 frontend can target XScale
        run: |
          mkdir -p out/clang
          cat > out/clang/probe.cpp <<'EOF'
          template<class T>
          concept Incrementable = requires(T v) { ++v; };
          static_assert(Incrementable<int>);
          int f(int x) { return x + 1; }
          EOF
          clang++ \
            --target=armv5te-none-eabi \
            -mcpu=xscale \
            -std=c++20 \
            -ffreestanding \
            -c out/clang/probe.cpp \
            -o out/clang/probe.o
          llvm-readobj --file-headers out/clang/probe.o
